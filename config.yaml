# VideoStreamBridge config
# Change device paths to match your actual capture card / output sink.
# Run `v4l2-ctl --list-devices` to find yours.

video:
  width: 1920
  height: 1080
  fps: 60
  capture_device: /dev/video0     # your USB HDMI capture card

model:
  path: models/model.onnx
  input_size: 640
  confidence_threshold: 0.5
  num_threads: 4                  # onnxruntime intra-op threads, RPi5 has 4 cores

output:
  # kmssink writes directly to the display, no window manager needed
  # if you're running under X11/Wayland instead, switch to autovideosink or ximagesink
  sink: kmssink
  fullscreen: true

pipeline:
  # queue leaky=downstream + max-size-buffers=1 means: always show
  # the newest frame, drop old ones instead of piling up latency
  queue_max_buffers: 1

logging:
  level: INFO
